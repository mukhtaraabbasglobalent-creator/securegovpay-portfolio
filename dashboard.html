<!DOCTYPE html>
<html>
<head>
  <title>SecureGovPay Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="card">
    <h1>Security Control Center</h1>
    <p>🔐 MFA Status: ACTIVE</p>
    <p>🛡 Encryption: ENABLED</p>
    <p>🚨 Fraud Detection: MONITORING</p>
  </div>

  <div class="card">
    <h2>Transaction Simulation</h2>

    <input placeholder="Service Name (e.g Passport Fee)">
    <input type="number" placeholder="Amount">

    <button onclick="process()">Process Payment</button>

    <p id="result"></p>
  </div>

</div>

<script>
function process(){
  document.getElementById("result").innerText =
  "Processing secure transaction...";

  setTimeout(()=>{
    document.getElementById("result").innerText =
    "✔ Payment Successful | Logged in Secure Audit System";
  },1500);
}
</script>

</body>
</html>
