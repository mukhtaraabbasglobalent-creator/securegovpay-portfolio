<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - SecureGovPay</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="card" style="text-align:center;">
    <h1>Security Control Center</h1>
    <p style="color:#22c55e;">🟢 System Status: Fully Operational</p>
  </div>

  <div class="card">
    <h2>System Security</h2>
    <p>✔ MFA ACTIVE</p>
    <p>✔ Encryption ENABLED</p>
    <p>✔ Fraud Detection MONITORING</p>
    <p>✔ API Gateway SECURE</p>
  </div>

  <div class="card">
    <h2>Transaction Simulator</h2>

    <input placeholder="Service Name">
    <input type="number" placeholder="Amount">

    <button onclick="process()">Process Payment</button>

    <p id="result"></p>
  </div>

  <div class="card">
    <h2>Audit Log</h2>

    <p>10:12 - Authentication SUCCESS</p>
    <p>10:13 - Transaction APPROVED</p>
    <p>10:14 - Fraud Check CLEARED</p>
  </div>

</div>

<script>
function process(){
  document.getElementById("result").innerText =
  "Processing secure transaction...";

  setTimeout(()=>{
    document.getElementById("result").innerText =
    "✔ Transaction Successful & Logged";
  },1500);
}
</script>

</body>
</html>
